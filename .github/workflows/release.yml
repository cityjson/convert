name: release

# Creates the GitHub release for the newest published version (the newest vX.Y.Z tag,
# which "Publish to npm" pushes), once npm serves it. Runs after "Publish to npm"
# succeeds. Idempotent: a version that already has a release (e.g. after a dry run,
# which publishes and tags nothing) is skipped. Can also be run by hand to retry.
on:
  workflow_run:
    workflows: ["Publish to npm"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # The version is the newest vX.Y.Z tag, which "Publish to npm" creates. npm's own
      # "latest" can lag a fresh publish (a first publish briefly shows 0.0.0-stage).
      - name: Version to release
        id: version
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "$tag" ]; then
            echo "No vX.Y.Z tag yet: nothing has been published, so there is no release to make." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Already released?
        id: existing
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "v${VERSION} already has a release; nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # npm commands run outside the repo: its devEngines pins pnpm, and npm refuses there.
      - name: Wait for npm to serve v${{ steps.version.outputs.version }}
        if: steps.version.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            cli="$(npm view "@cityjson/cjconv@${VERSION}" version 2> /dev/null || true)"
            core="$(npm view "@cityjson/cjconv-core@${VERSION}" version 2> /dev/null || true)"
            if [ "$cli" = "$VERSION" ] && [ "$core" = "$VERSION" ]; then exit 0; fi
            echo "npm does not serve ${VERSION} of both packages yet (attempt ${attempt}); waiting."
            sleep 10
          done
          echo "::error::v${VERSION} is tagged, but npm does not serve @cityjson/cjconv@${VERSION} and @cityjson/cjconv-core@${VERSION}."
          exit 1

      - name: Fetch the published tarballs
        if: steps.version.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm pack "@cityjson/cjconv-core@${VERSION}" "@cityjson/cjconv@${VERSION}"

      - name: Create the release
        if: steps.version.outputs.skip != 'true' && steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Published to npm:
          - [\`@cityjson/cjconv@${VERSION}\`](https://www.npmjs.com/package/@cityjson/cjconv/v/${VERSION}) — the \`cjconv\` CLI and Node library
          - [\`@cityjson/cjconv-core@${VERSION}\`](https://www.npmjs.com/package/@cityjson/cjconv-core/v/${VERSION})

          \`\`\`sh
          npm install -g @cityjson/cjconv@${VERSION}
          \`\`\`
          EOF
          gh release create "v${VERSION}" \
            --verify-tag \
            --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            "$RUNNER_TEMP"/cityjson-cjconv-*.tgz
